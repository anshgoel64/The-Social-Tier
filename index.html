<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Social Tier — Digital Marketing & Video Production Agency</title>
    <meta
      name="description"
      content="Full-service digital marketing and in-house commercial video production studio delivering high-impact ad films, SEO, performance advertising, and brand growth."
    />
    <meta property="og:title" content="The Social Tier — Digital Marketing & Video Production Agency" />
    <meta
      property="og:description"
      content="Full-service digital marketing and in-house commercial video production studio delivering high-impact ad films, SEO, performance advertising, and brand growth."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__APP_ENTRY_FAILED__ = function () {
        var root = document.getElementById('root');
        if (!root || root.childElementCount > 0) return;
        document.body.style.background = '#070709';
        document.body.style.color = '#f9fafb';
        document.body.style.fontFamily = 'Poppins, system-ui, sans-serif';
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">' +
          '<div style="max-width:560px;background:#111216;border:1px solid rgba(255,122,0,0.4);border-radius:14px;padding:28px;line-height:1.6;">' +
          '<div style="color:#ff7a00;font-weight:700;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px;">GitHub Pages Build Required</div>' +
          '<h1 style="margin:0 0 12px;font-size:22px;color:#fff;">Deploy the Built App (dist/)</h1>' +
          '<p style="margin:0 0 12px;font-size:14px;color:#cbd5e1;">GitHub Pages is currently serving raw source files instead of the built Vite bundle.</p>' +
          '<ol style="margin:0;padding-left:20px;font-size:14px;color:#e4e4e7;">' +
          '<li>Ensure <strong>.github/workflows/deploy.yml</strong> is pushed to your repository.</li>' +
          '<li>Open <strong>Settings &rarr; Pages &rarr; Build and deployment &rarr; Source</strong> and select <strong>GitHub Actions</strong>.</li>' +
          '</ol></div></div>';
      };
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__APP_ENTRY_FAILED__()"></script>
  </body>
</html>
